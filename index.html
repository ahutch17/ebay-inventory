<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelf Sync — Listing Freshness &amp; SEO Tracker</title>
    <!-- Corrected & Official Tailwind CSS Play CDN Link -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#EBE0D5]">

    <div class="min-h-screen flex flex-col items-center justify-between p-12 text-center">
        
        <div class="flex-1 flex flex-col items-center justify-center">
            <!-- 1. The Botanical Logo Frame -->
            <div class="w-32 h-32 rounded-full border-4 border-[#C5CBBF] bg-white flex items-center justify-center p-4 mb-6 shadow-sm overflow-hidden">
                <img src="https://imgbox.com" alt="Shelf Sync Logo" class="w-full h-full object-contain" />

            </div>
            
            <!-- 2. The Headings -->
            <h1 class="text-4xl font-bold tracking-widest text-[#54655A] mb-2 font-serif">SHELF SYNC</h1>
            <p class="text-xs font-semibold text-[#C0A99E] uppercase tracking-wider">Listing Freshness &amp; SEO Tracker</p>
        </div>
        
        <!-- 3. The Bottom Button Layout Component -->
        <div class="w-full max-w-sm flex flex-col items-center mb-8">
            <button class="w-full py-3 bg-[#54655A] text-white font-semibold tracking-widest uppercase text-sm rounded hover:bg-[#C0A99E] transition-colors duration-300 shadow-sm">
                Tap to Enter
            </button>
        </div>

    </div>

</body>
</html>
