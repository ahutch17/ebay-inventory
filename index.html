<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelf Sync — Listing Freshness &amp; SEO Tracker</title>
    <style>
        /* 1. Internal Pure CSS Layout Engine (Bypasses Script Censorship) */
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #E6DCCE;
            color: #4A554D;
        }
        
        /* Full Page Image Scaling */
        .splash-container {
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 48px 24px;
            background-image: url('welcome-bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Rounded Button Design Layout */
        .enter-btn {
            width: 100%;
            max-width: 280px;
            padding: 14px 28px;
            background-color: #54655A;
            color: #FFFFFF;
            border: none;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, transform 0.2s;
            margin-bottom: 80px;
            z-index: 10;
        }
        .enter-btn:hover { background-color: #C0A99E; }
        .enter-btn:active { transform: scale(0.98); }

        /* Hidden Dashboard View Framework Tags */
        .hidden-panel { display: none !important; }
        
        .dashboard-container {
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
        }
        .dash-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-b: 1px solid #C5CBBF;
            border-bottom: 1px solid #C5CBBF;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .csv-btn {
            padding: 8px 16px;
            background-color: #54655A;
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
        }
        .empty-notice {
            text-align: center;
            padding: 48px 24px;
            background: #FFFFFF;
            border: 1px dashed #C5CBBF;
            border-radius: 6px;
            font-size: 13px;
            color: #7C8B80;
        }
    </style>
</head>
<body>

    <!-- SCREEN A: THE PREMIUM CUSTOM BACKGROUND SPLASH SCREEN -->
    <div id="splash-screen" class="splash-container">
        <!-- Interactive Clickable Entry Overlay Button Layout Component -->
        <button onclick="enterDashboard()" class="enter-btn">
            Tap to Enter
        </button>
    </div>

    <!-- SCREEN B: THE MAIN DASHBOARD SHELL (Hidden until enter button click) -->
    <div id="dashboard-screen" class="dashboard-container hidden-panel">
        <header class="dash-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 24px; height: 24px; border-radius: 50%; background-color: #54655A; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 10px; font-weight: bold;">S</div>
                <h2 style="font-size: 16px; font-weight: 700; margin: 0; tracking-spacing: 0.05em;">SHELF SYNC</h2>
            </div>
            <button class="csv-btn">
                📤 Import CSV
            </button>
        </header>

        <main class="empty-notice">
            Welcome to your Dashboard! Import your eBay Active Listings report file to populate your list elements.
        </main>
    </div>

    <!-- BRAIN FUNCTION LOGIC SCRIPTS -->
    <script type="text/javascript">
        function enterDashboard() {
            // Find Screen A and hide it
            document.getElementById('splash-screen').classList.add('hidden-panel');
            
            // Find Screen B and reveal it natively
            document.getElementById('dashboard-screen').classList.remove('hidden-panel');
        }
    </script>

</body>
</html>
