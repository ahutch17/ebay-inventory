<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf Sync &mdash; Listing freshness &amp; SEO tracker</title>
<meta name="description" content="Track how old your eBay listings are and speed up SEO fixes.">
<meta name="theme-color" content="#54655A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- The only outside code this app uses: the CSV reader. Nothing else. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>

<style>
/* ---------- palette. Every text colour here is contrast checked. ---------- */
:root{
  --cream:#EBE0D5;      /* background */
  --surface:#F7F2EB;     /* cards and rows */
  --sage:#C5CBBF;        /* borders and badges only, never text */
  --line:#D8CFC2;        /* hairlines */
  --ink:#2F3A33;         /* headings */
  --body:#54655A;        /* body text */
  --fresh:#4F7B5C;       /* 0 to 13 days */
  --aging:#6E7A4F;       /* 14 to 30 days */
  --stale:#A2604B;       /* 31 days and up */
  --radius:8px;
  --shadow:0 1px 2px rgba(47,58,51,.05), 0 4px 12px rgba(47,58,51,.06);
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--body);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,p{margin:0}
button{font:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.note{font-size:14px;color:var(--body)}
.mono{font-variant-numeric:tabular-nums}

/* ---------- buttons: 44px tall so they are easy to hit ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:10px 16px;
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius);
  font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
}
.btn:hover{border-color:var(--body)}
.btn-solid{background:var(--body);border-color:var(--body);color:#F7F2EB}
.btn-quiet{background:transparent}
.btn-danger{background:transparent;border-color:var(--stale);color:var(--stale)}
.btn-full{width:100%}

/* ---------- SCREEN A: splash ---------- */
#splash{
  position:fixed;inset:0;z-index:40;overflow:hidden;
  background:var(--cream);
  transition:transform .45s ease;
}
#splash.gone{transform:translateY(-100%)}
#splashFallback,#splashArt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.splash-inner{
  position:absolute;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));
  padding:0 24px;text-align:center;
}
.splash-mark{font-family:var(--serif);font-size:30px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);line-height:1.2}
.splash-sub{font-size:15px;margin-top:6px;color:var(--body)}
#enterBtn{margin-top:22px;background:var(--surface);border-color:var(--ink);min-width:200px}
/* When your own splash artwork loads, the app hides its own title text so your
   design stands alone, and switches the button to a translucent forest green
   mask so the paper texture shows through. */
#splash.has-art .splash-mark,#splash.has-art .splash-sub{display:none}
#splash.has-art .splash-inner{bottom:calc(64px + env(safe-area-inset-bottom))}
#splash.has-art #enterBtn{
  background:rgba(84,101,90,.82);border-color:rgba(247,242,235,.45);color:#F7F2EB;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
</style>
<style>
/* ---------- SCREEN B: header ---------- */
header{border-bottom:1px solid var(--line);background:var(--cream);position:sticky;top:0;z-index:20}
/* Centred header. NOTE: this rule must keep its own side padding, because it
   lands after .wrap in the stylesheet and would otherwise cancel it out,
   which is what pushed the wordmark against the left edge. */
.head-row{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:16px}
.wordmark{font-family:var(--serif);font-size:21px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink);margin:0;line-height:1.15}
.tagline{font-size:14px;margin:2px 0 0}
.head-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- stats ---------- */
#stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:20px 0 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:14px;margin-top:4px}

/* ---------- controls ---------- */
#controls{margin:20px 0 0;display:grid;gap:8px}
.in{width:100%;min-height:44px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--body)}
.in:focus{border-color:var(--ink);outline:none}
.filter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
/* Sort sits alone on its own line, so let it span the full width instead of
   leaving a lopsided half-empty gap beside it. */
#fSort{grid-column:1 / -1}
#count{font-size:14px;margin:16px 0 8px;text-align:center}

/* ---------- listing rows ---------- */
#list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:76px}
.row:hover{border-color:var(--body)}
.thumb{flex:0 0 auto;width:52px;height:52px;border-radius:6px;background:var(--sage);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;color:var(--ink)}
.row-main{flex:1 1 auto;width:0;min-width:0;overflow:hidden}
.row-title{margin:0;font-size:15px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-meta{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:hidden;margin-top:5px}
.pill{flex:0 0 auto;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sage);color:var(--ink);white-space:nowrap}
.cat,.flag{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.flag{flex:0 0 auto;color:var(--stale);font-weight:600}
.bubble{flex:0 0 auto;width:56px;height:56px;border-radius:50%;border:2px solid var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream)}
.bubble b{font-size:17px;line-height:1;font-variant-numeric:tabular-nums}
.bubble span{font-size:9px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

/* ---------- empty + footer ---------- */
.empty{text-align:center;padding:48px 24px;border:1px dashed var(--line);border-radius:8px;margin-top:24px}
.empty h2{font-family:var(--serif);font-size:19px;color:var(--ink);margin:0 0 8px}
footer{margin:40px 0 0;padding:24px 0 40px;border-top:1px solid var(--line);text-align:center}
.foot-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
#version{font-size:13px;margin-top:16px}

/* ---------- center-peek card ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(47,58,51,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--cream);border:1px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:460px;max-height:88vh;display:flex;flex-direction:column}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.card-head h2{font-family:var(--serif);font-size:18px;color:var(--ink);margin:0;line-height:1.3}
.x{width:44px;height:44px;margin:-10px -10px 0 0;border:0;background:transparent;font-size:18px;color:var(--ink);flex:0 0 auto}
.card-body{padding:16px;overflow-y:auto;display:grid;gap:16px}
.card-foot{padding:16px;border-top:1px solid var(--line);display:flex;gap:8px}
.card-foot .btn{flex:1}
.field{display:block}
.label{font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin:0 0 6px;color:var(--body)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:15px;cursor:pointer;min-height:44px}
.check input{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto}
.days-line{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:15px;margin:0}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:8px;font-size:14px;max-width:88vw;text-align:center;box-shadow:var(--shadow)}

@media(min-width:560px){
  #stats{grid-template-columns:repeat(4,1fr)}
  .filter-grid{grid-template-columns:repeat(3,1fr)}
  /* three across on a wide screen, so sort no longer needs its own line */
  #fSort{grid-column:auto}
}
@media(prefers-reduced-motion:reduce){#splash{transition:none}}
</style>
</head>
<body>

<!-- ============ SCREEN A: splash entry ============
     Drop your own artwork in the repo as splash.png and it will cover the
     whole screen. If that file is missing, the botanical drawing below is
     used instead, so nothing ever breaks. -->
<div id="splash">
  <svg id="splashFallback" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="390" height="844" fill="#EBE0D5"/>
    <circle cx="288" cy="172" r="48" fill="#C0A99E" opacity=".42"/>
    <g stroke="#B9C2B3" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M40 844 C 26 660 44 512 92 402"/>
      <path d="M352 844 C 366 672 346 528 296 424"/>
    </g>
    <g fill="#C5CBBF">
      <ellipse rx="26" ry="10" transform="translate(92,402) rotate(-40)"/>
      <ellipse rx="24" ry="9" transform="translate(84,446) rotate(26)"/>
      <ellipse rx="28" ry="10" transform="translate(76,498) rotate(-34)"/>
      <ellipse rx="25" ry="9" transform="translate(68,552) rotate(22)"/>
      <ellipse rx="30" ry="11" transform="translate(60,610) rotate(-28)"/>
      <ellipse rx="26" ry="10" transform="translate(52,670) rotate(20)"/>
      <ellipse rx="31" ry="11" transform="translate(46,734) rotate(-24)"/>
      <ellipse rx="27" ry="10" transform="translate(42,798) rotate(18)"/>
      <ellipse rx="25" ry="9" transform="translate(296,424) rotate(38)"/>
      <ellipse rx="23" ry="9" transform="translate(304,468) rotate(-24)"/>
      <ellipse rx="27" ry="10" transform="translate(313,520) rotate(32)"/>
      <ellipse rx="24" ry="9" transform="translate(322,576) rotate(-20)"/>
      <ellipse rx="29" ry="11" transform="translate(330,634) rotate(26)"/>
      <ellipse rx="25" ry="10" transform="translate(337,696) rotate(-18)"/>
      <ellipse rx="30" ry="11" transform="translate(343,760) rotate(22)"/>
    </g>
    <g fill="#9FAE9B" opacity=".45">
      <ellipse rx="18" ry="7" transform="translate(110,470) rotate(-58)"/>
      <ellipse rx="17" ry="7" transform="translate(96,596) rotate(-52)"/>
      <ellipse rx="19" ry="7" transform="translate(280,506) rotate(56)"/>
      <ellipse rx="17" ry="7" transform="translate(298,640) rotate(50)"/>
    </g>
  </svg>
  <!-- Your artwork. Commit it to the repo as splash.png (or splash.jpg) and it
       takes over this whole screen. If it is missing, the drawing above shows
       instead, so the app never breaks. -->
  <img id="splashArt" src="splash.png" alt=""
       onload="document.getElementById('splash').classList.add('has-art')"
       onerror="if(this.src.indexOf('splash.png')>-1){this.src='splash.jpg';}else{this.remove();}">
  <div class="splash-inner">
    <p class="splash-mark">Shelf Sync</p>
    <p class="splash-sub">Listing freshness &amp; SEO tracker</p>
    <button id="enterBtn" class="btn" type="button">Tap to enter</button>
  </div>
</div>

<!-- ============ SCREEN B: dashboard ============ -->
<header>
  <div class="wrap head-row">
    <div>
      <h1 class="wordmark">Shelf Sync</h1>
      <p class="tagline">Listing freshness &amp; SEO tracker</p>
    </div>
    <div class="head-actions">
      <button id="importBtn" class="btn" type="button">Import CSV</button>
      <button id="addBtn" class="btn btn-solid" type="button">Add</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="stats" hidden></div>

  <div id="controls" hidden>
    <input id="fSearch" class="in" type="search" placeholder="Search title, location or item number" aria-label="Search listings">
    <div class="filter-grid">
      <select id="fLoc" class="in" aria-label="Filter by location"></select>
      <select id="fCat" class="in" aria-label="Filter by category"></select>
      <select id="fSort" class="in" aria-label="Sort listings">
        <option value="stale">Oldest first</option>
        <option value="fresh">Newest first</option>
        <option value="priority">Priority</option>
        <option value="watchers">Most watchers</option>
        <option value="az">A to Z</option>
      </select>
    </div>
  </div>

  <p id="count" class="mono"></p>
  <div id="list"></div>

  <div id="loadMoreWrap" hidden style="margin-top:12px">
    <button id="loadMore" class="btn btn-quiet btn-full" type="button">Show more</button>
  </div>

  <div id="empty" class="empty" hidden>
    <h2>Nothing on the shelf yet</h2>
    <p class="note" style="max-width:36ch;margin:0 auto 20px">Import your eBay active listings report and every item gets a real age, counted from its true start date.</p>
    <button id="emptyImport" class="btn btn-solid" type="button">Import CSV</button>
  </div>

  <footer>
    <svg width="92" height="22" viewBox="0 0 92 22" aria-hidden="true">
      <path d="M2 11h88" stroke="#D8CFC2" stroke-width="1"/>
      <g fill="#C5CBBF">
        <ellipse rx="11" ry="4" transform="translate(46,11) rotate(-22)"/>
        <ellipse rx="9" ry="3.5" transform="translate(31,11) rotate(20)"/>
        <ellipse rx="9" ry="3.5" transform="translate(61,11) rotate(-20)"/>
      </g>
    </svg>
    <div class="foot-actions">
      <button id="backupBtn" class="btn btn-quiet" type="button">Back up to a file</button>
      <button id="restoreBtn" class="btn btn-quiet" type="button">Restore a backup</button>
      <button id="resetBtn" class="btn btn-danger" type="button">Erase all</button>
    </div>
    <p id="version" class="note"></p>
  </footer>
</main>

<input id="csvInput" type="file" accept=".csv,text/csv" hidden>
<input id="restoreInput" type="file" accept=".json,application/json" hidden>
<div id="modalMount"></div>

<script src="app.js" defer></script>
</body>
  </html>
