<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelf Sync — Listing Freshness &amp; SEO Tracker</title>
    <!-- Official Tailwind CSS Framework Engine Link -->
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://googleapis.com');
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-[#EBE0D5]">

    <div class="min-h-screen flex flex-col items-center justify-between p-12 text-center">
        
        <!-- The Main Welcome Core Layout Blocks -->
        <div class="flex-1 flex flex-col items-center justify-center">
            <!-- 1. Pure Code Botanical Logo Frame (Zero Image Files Required!) -->
            <div class="w-32 h-32 rounded-full border-4 border-[#C5CBBF] bg-white flex items-center justify-center p-6 mb-6 shadow-sm overflow-hidden">
                <svg viewBox="0 0 24 24" class="w-full h-full text-[#54655A] fill-none stroke-current" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Smooth circular badge accent -->
                    <path d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2Z" class="text-[#C5CBBF]" style="opacity: 0.25; fill: #C5CBBF;" />
                    <!-- Minimalist line art botanical branches and leaves -->
                    <path d="M12 22V11m0 0c1.5-2 3.5-3.5 6-3.5M12 11c-1.5-2-3.5-3.5-6-3.5M12 15c2-1.5 4-2 6-1.5M12 15c-2-1.5-4-2-6-1.5M12 18c1.5-1 3-1 4.5-.5M12 18c-1.5-1-3-1-4.5-.5" />
                    <circle cx="18" cy="7.5" r="1" class="fill-current text-[#C0A99E]" style="stroke: none;" />
                    <circle cx="6" cy="7.5" r="1" class="fill-current text-[#C0A99E]" style="stroke: none;" />
                </svg>
            </div>
            
            <!-- 2. The Headings Layout UI -->
            <h1 class="text-4xl font-bold tracking-widest text-[#54655A] mb-2 font-serif">SHELF SYNC</h1>
            <p class="text-xs font-semibold text-[#C0A99E] uppercase tracking-wider">Listing Freshness &amp; SEO Tracker</p>
        </div>
        
        <!-- 3. The Bottom Welcome Action Buttons Frame -->
        <div class="w-full max-w-sm flex flex-col items-center mb-8">
            <button class="w-full py-3 bg-[#54655A] text-white font-semibold tracking-widest uppercase text-sm rounded hover:bg-[#C0A99E] transition-colors duration-300 shadow-sm">
                Tap to Enter
            </button>
        </div>

    </div>

</body>
</html>
