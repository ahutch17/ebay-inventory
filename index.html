<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelf Sync — Listing Freshness &amp; SEO Tracker</title>
    <!-- Official Tailwind CSS Framework Engine Link -->
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://googleapis.com');
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif;
            color: #4A554D;
        }
        .hidden-panel { display: none !important; }
    </style>
</head>
<body class="bg-[#E6DCCE]">

    <!-- SCREEN A: THE PREMIUM CUSTOM BACKGROUND SPLASH SCREEN -->
    <div id="splash-screen" class="min-h-screen flex flex-col items-center justify-end p-12 text-center relative overflow-hidden select-none bg-cover bg-center bg-no-repeat" 
         style="background-image: url('welcome-bg.png');">
        
        <!-- Interactive Clickable Entry Overlay Button Layout Component -->
        <div class="w-full max-w-sm flex flex-col items-center justify-end z-10 pb-24 mx-auto">
            <button onclick="enterDashboard()" class="px-10 py-3 bg-[#54655A] text-white font-semibold tracking-widest uppercase text-xs rounded-full hover:bg-[#C0A99E] transition-colors duration-300 shadow-md backdrop-blur-sm cursor-pointer">
                Tap to Enter
            </button>
        </div>

    </div>

    <!-- SCREEN B: THE MAIN DASHBOARD SHELL (Hidden until enter button click) -->
    <div id="dashboard-screen" class="hidden-panel p-6 max-w-md mx-auto">
        <header class="flex items-center justify-between pb-4 border-b border-[#C5CBBF] mb-6">
            <div class="flex items-center space-x-2">
                <div class="w-6 h-6 rounded-full bg-[#54655A] flex items-center justify-center text-white text-[10px] font-bold">S</div>
                <h2 class="text-base font-bold tracking-wider text-[#54655A]">SHELF SYNC</h2>
            </div>
            <button class="px-3 py-1.5 border border-[#54655A] text-[#54655A] bg-white rounded text-xs font-bold uppercase hover:bg-[#C5CBBF] transition-colors">
                📤 Import CSV
            </button>
        </header>

        <main class="text-center py-12 bg-white rounded border border-dashed border-[#C5CBBF] text-xs font-medium text-[#C0A99E] px-4">
            Welcome to your Dashboard! Import your eBay Active Listings report file to populate your list elements.
        </main>
    </div>

    <!-- BRAIN FUNCTION LOGIC SCRIPTS -->
    <script type="text/javascript">
        function enterDashboard() {
            // Find Screen A and hide it
            document.getElementById('splash-screen').classList.add('hidden-panel');
            
            // Find Screen B and reveal it natively
            document.getElementById('dashboard-screen').classList.remove('hidden-panel');
        }
    </script>

</body>
</html>
